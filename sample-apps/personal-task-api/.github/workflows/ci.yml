name: personal-task-api-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and smoke import
        run: |
          pip install fastapi uvicorn
          python -c "from main import app; print('import_ok', app.title)"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            printf 'fastapi>=0.115\nuvicorn[standard]>=0.30\n' > requirements.txt
          fi
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: personal-task-api-sunny
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
