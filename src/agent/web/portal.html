<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp AI Agent Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0078d4;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        h1, h2, h3 {
            color: #005a9e;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #005a9e;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <header>
        <h1>WhatsApp AI Agent Portal</h1>
    </header>
    <main>
        <h2>Agent Status</h2>
        <div class="status success">All systems operational.</div>
        <h3>Capabilities</h3>
        <ul>
            <li>Read and summarize emails</li>
            <li>Schedule meetings</li>
            <li>Manage repositories</li>
            <li>Develop and review code</li>
            <li>Deploy to production</li>
        </ul>
        <button>Refresh Status</button>
    </main>
</body>
</html>
