<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunny's Personal AI Agent Portal</title>
    <style>
        /* Reset some default styles */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1.5rem 2rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        header h1 {
            margin: 0;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: 1.2px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .portal-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
            padding: 3rem 4rem;
            text-align: center;
        }
        .portal-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .portal-container p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #e0e0e0;
            line-height: 1.5;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .btn {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn:hover,
        .btn:focus {
            background: #574fd6;
            box-shadow: 0 6px 20px rgba(87, 79, 214, 0.6);
            outline: none;
        }
        .btn:active {
            background: #453bb8;
            box-shadow: 0 2px 10px rgba(69, 59, 184, 0.8);
        }
        footer {
            text-align: center;
            padding: 1rem 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            background-color: rgba(0, 0, 0, 0.15);
            user-select: none;
        }
        @media (max-width: 600px) {
            .portal-container {
                padding: 2rem 2rem;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .portal-container h2 {
                font-size: 1.5rem;
            }
            .btn {
                font-size: 1rem;
                padding: 0.65rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Sunny's Personal AI Agent</h1>
    </header>
    <main>
        <section class="portal-container" role="main" aria-labelledby="portal-title">
            <h2 id="portal-title">Welcome to Your AI Assistant Portal</h2>
            <p>Manage your tasks, emails, meetings, and code repositories seamlessly with Sunny's AI-powered assistant.</p>
            <div class="button-group">
                <a href="/docs" class="btn" role="button" aria-label="API Documentation">API Docs</a>
                <a href="/health" class="btn" role="button" aria-label="Health Check">Health Check</a>
                <a href="/tasks" class="btn" role="button" aria-label="View Tasks">View Tasks</a>
                <a href="/whatsapp" class="btn" role="button" aria-label="WhatsApp Integration">WhatsApp</a>
            </div>
        </section>
    </main>
    <footer>
        &copy; 2024 Sunny's AI Agent. All rights reserved.
    </footer>
</body>
</html>
