<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp AI Agent Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #009688;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        h1, h2, h3 {
            color: #009688;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .feature {
            margin-bottom: 20px;
        }
        .feature h3 {
            margin-top: 0;
        }
        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #009688;
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>WhatsApp AI Agent Portal</h1>
    </header>
    <main>
        <div class="container">
            <h2>Welcome to the Portal</h2>
            <p>This portal provides an overview of the AI agent's capabilities and status.</p>
            <div class="feature">
                <h3>Feature 1</h3>
                <p>Details about feature 1.</p>
            </div>
            <div class="feature">
                <h3>Feature 2</h3>
                <p>Details about feature 2.</p>
            </div>
            <!-- Add more features as needed -->
        </div>
    </main>
    <footer>
        <p>&copy; 2023 WhatsApp AI Agent</p>
    </footer>
</body>
</html>
