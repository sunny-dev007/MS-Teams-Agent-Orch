<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        .status-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
        .operational {
            background-color: green;
        }
        .demo {
            background-color: blue;
        }
        .last-updated {
            margin-top: 10px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="status-board">
        <div class="badge operational">WhatsApp: Operational</div>
        <div class="badge operational">Teams: Operational</div>
        <div class="badge demo">Knowledge: Demo</div>
        <div class="badge operational">Boards: Operational</div>
        <div class="badge demo">Dev Agent: Demo</div>
        <div class="badge operational">Docs: Operational</div>
        <div class="last-updated">Last updated: June 2024</div>
    </div>
    <!--
    Status section updated to include a visual status board with health badges.
    Each badge indicates the status of a system component using color and text.
    The section is designed to be scannable in 2 seconds and works with JavaScript disabled.
    -->
</body>
</html>
