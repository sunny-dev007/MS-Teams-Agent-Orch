# CI/CD for WhatsApp AI Agent → Azure App Service (whatsapp-ai-agent-sunny)
#
# Reliable path for App Service Python:
#   - Ship SOURCE only (no host-built .python_packages)
#   - Let Oryx build antenv ON App Service (matches App Service glibc)
#   - Do NOT stop the site; deploy async; success = /health 200
#
# Why not prebuild on ubuntu/docker slim?
#   cryptography/pydantic wheels from newer glibc fail on App Service with:
#   GLIBC_2.33 not found — breaks WhatsApp hello when graph imports Google libs.
# Live App Service deploy runs ONLY from main (after WhatsApp APPROVE merges the PR).
# Agent feature branches must NOT deploy — that caused "Deploy skipped" confusion and
# previously let bad agent PRs break production when merged without a clean main CI.
trigger:
  branches:
    include:
      - main

# PR validation (tests only) when an agent/* PR targets main — Deploy stage stays skipped.
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail
              echo "Branch: $(Build.SourceBranch)"
              echo "Reason: $(Build.Reason)"
              if [ "$(Build.SourceBranch)" = "refs/heads/main" ] && [ "$(Build.Reason)" != "PullRequest" ]; then
                echo "Mode: MAIN — Deploy stage will run after tests pass."
              else
                echo "Mode: VALIDATE ONLY — Deploy is intentionally skipped."
                echo "Live deploy happens only after WhatsApp APPROVE merges this PR into main."
              fi
            displayName: "CI mode (main deploy vs PR validate)"

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install "pydantic-settings>=2.9"
              pip install pytest pytest-asyncio httpx
              pip install .
              python -c "from pydantic_settings import BaseSettings; print('pydantic-settings OK')"
            displayName: "Install deps for tests"

          - script: |
              set -euo pipefail
              # Fail only on real import lines (not detector strings in code_guards/tests).
              PYTHONPATH=src python - <<'PY'
              import re
              import sys
              from pathlib import Path

              pat = re.compile(r"^\s*from\s+pydantic\s+import\s+.*\bBaseSettings\b")
              bad = []
              for path in Path("src").rglob("*.py"):
                  for i, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if pat.search(line):
                          bad.append(f"{path}:{i}: {line.strip()}")
              if bad:
                  print("##vso[task.logissue type=error]Forbidden: BaseSettings must be imported from pydantic-settings (Pydantic v2).")
                  print("\n".join(bad))
                  sys.exit(1)
              cfg = Path("src/agent/config.py").read_text(encoding="utf-8")
              if "from pydantic_settings import BaseSettings" not in cfg:
                  print("##vso[task.logissue type=error]src/agent/config.py must import BaseSettings from pydantic-settings.")
                  sys.exit(1)
              print("BaseSettings import guard OK")
              PY
              PYTHONPATH=src python -c "from agent.config import settings; print('config OK', settings.azure_openai_deployment)"
              PYTHONPATH=src python - <<'PY'
              from agent.main import app
              paths = set(app.openapi().get("paths") or {})
              required = (
                  "/webhooks/whatsapp",
                  "/webhooks/gmail",
                  "/health",
                  "/portal",
                  "/api/channels/copilot/health",
                  "/api/channels/copilot/message",
              )
              missing = [p for p in required if p not in paths]
              if missing:
                  raise SystemExit(f"main.py missing routes {missing}; agent rewrite blocked")
              print("Route mount guard OK", required)
              # Plain UUID must not crash Settings (App Service ALLOWED_TEAMS_USER_IDS format).
              import os
              from agent.config import Settings

              os.environ["ALLOWED_TEAMS_USER_IDS"] = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
              parsed = Settings().allowed_teams_user_ids
              if parsed != ["aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"]:
                  raise SystemExit(f"ALLOWED_TEAMS_USER_IDS plain UUID parse failed: {parsed!r}")
              print("Teams allowlist env parse guard OK")
              PY
              # Catch azure-pipelines.yml parse breaks before push causes "Informational run".
              python - <<'PY'
              from pathlib import Path

              try:
                  import yaml
              except ImportError:
                  import subprocess, sys
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])
                  import yaml

              path = Path("azure-pipelines.yml")
              try:
                  docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except Exception as exc:
                  raise SystemExit(f"azure-pipelines.yml YAML parse failed: {exc}") from exc
              if not docs or not isinstance(docs[0], dict):
                  raise SystemExit("azure-pipelines.yml did not load as a mapping")
              required = ("trigger", "stages", "pool")
              missing = [k for k in required if k not in docs[0]]
              if missing:
                  raise SystemExit(f"azure-pipelines.yml missing keys: {missing}")
              print("azure-pipelines.yml YAML parse guard OK")
              PY
              test -f infra/verify_post_deploy.sh
              PYTHONPATH=src python -m pytest tests/ -v --tb=short -q
            displayName: "Run tests"

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                --exclude='sample-apps/' \
                --exclude='.python_packages/' \
                --exclude='antenv/' \
                --exclude='src/web/' \
                "$(Build.SourcesDirectory)/" "$STAGE/"
            displayName: "Stage source package (no prebuilt wheels)"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy (Oryx on App Service)"
    dependsOn: Build
    # Production App Service only from main branch CI — never from agent/* or PR validation.
    condition: |
      and(
        succeeded('Build'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        timeoutInMinutes: 45
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          - task: AzureCLI@2
            displayName: "Enable Oryx remote build + startup"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Keep site running — avoid long stop/start outages.
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                    ENABLE_ORYX_BUILD=true \
                    ORYX_DISABLE_OUTPUT_COPY_COMPRESSION=true \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
                    SCM_COMMAND_IDLE_TIMEOUT=1800 \
                    GIT_PYTHON_REFRESH=quiet \
                    DATABASE_URL=sqlite+aiosqlite:////home/site/data/agent.db \
                    WORKSPACE_DIR=/home/site/data/workspaces
                # Remove host PYTHONPATH that pointed at incompatible .python_packages
                az webapp config appsettings delete \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --setting-names PYTHONPATH \
                  || true
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "bash infra/startup.sh"

          - task: AzureCLI@2
            displayName: "ZIP deploy async (Kudu — no site-start wait)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ZIP="$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                test -f "$ZIP"
                echo "Uploading $(du -h "$ZIP" | cut -f1) via Kudu async zipdeploy"

                KUDU_USER=$(az webapp deployment list-publishing-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --query publishingUserName -o tsv)
                KUDU_PASS=$(az webapp deployment list-publishing-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --query publishingPassword -o tsv)

                # Kudu returns 409 when a prior Oryx/zipdeploy is still running (common after restart).
                HTTP=""
                for attempt in $(seq 1 12); do
                  HTTP=$(curl -sS -w "%{http_code}" -o /tmp/kudu_deploy.json \
                    -X POST \
                    -u "${KUDU_USER}:${KUDU_PASS}" \
                    "https://$(appName).scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
                    --data-binary @"$ZIP" \
                    -H "Content-Type: application/octet-stream" \
                    --max-time 600 || echo 000)

                  echo "Kudu zipdeploy attempt ${attempt} HTTP ${HTTP}"
                  head -c 2000 /tmp/kudu_deploy.json 2>/dev/null || true
                  echo
                  case "$HTTP" in
                    200|202|204)
                      echo "Zip accepted — Oryx build runs on App Service."
                      exit 0
                      ;;
                    409)
                      echo "Deploy in progress — waiting before retry..."
                      sleep 30
                      ;;
                    *)
                      echo "Kudu async zipdeploy failed"
                      exit 1
                      ;;
                  esac
                done
                echo "Kudu async zipdeploy still conflicted after retries (HTTP ${HTTP})"
                exit 1

          # Deploy job downloads the zip only — checkout again so verify script is available.
          - checkout: self
            clean: false
            displayName: "Checkout verify scripts"

          - task: AzureCLI@2
            displayName: "Verify health + Copilot auth + check my repos"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Keep complex checks in infra/*.sh — unindented heredocs inside YAML break ADO parsing
                # and produce "Informational run" / canceled pipelines with no stages.
                chmod +x "$(Build.SourcesDirectory)/infra/verify_post_deploy.sh"
                bash "$(Build.SourcesDirectory)/infra/verify_post_deploy.sh" "$(appName)" "$(resourceGroup)"
