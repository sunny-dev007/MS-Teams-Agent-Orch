# CI/CD for WhatsApp AI Agent → Azure App Service (whatsapp-ai-agent-sunny)
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install .
            displayName: "Install dependencies"

          - script: |
              set -euo pipefail
              pip install pytest pytest-asyncio httpx
              PYTHONPATH=src python -m pytest tests/ -v --tb=short
            displayName: "Run tests"
            continueOnError: true

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                "$(Build.SourcesDirectory)/" "$STAGE/"
            displayName: "Stage deploy files"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy to Azure App Service"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        timeoutInMinutes: 90
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          # AzureWebApp@1 times out (~10m) while Oryx remote-build is still running.
          # Stop the site, deploy with a long wait via Azure CLI, then start + verify.
          - task: AzureCLI@2
            displayName: "Stop app and prepare deploy settings"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp stop \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)"
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                    ENABLE_ORYX_BUILD=true \
                    ORYX_DISABLE_OUTPUT_COPY_COMPRESSION=true \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
                    GIT_PYTHON_REFRESH=quiet
                az webapp config appsettings delete \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --setting-names PYTHONPATH \
                  || true

          - task: AzureCLI@2
            displayName: "ZIP deploy (wait for Oryx build)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ZIP="$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                test -f "$ZIP"
                echo "Deploying $ZIP"
                # config-zip waits for remote build; timeout is seconds
                az webapp deployment source config-zip \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --src "$ZIP" \
                  --timeout 1800

          - task: AzureCLI@2
            displayName: "Start app, set startup, verify health"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                STARTUP='python -m uvicorn agent.main:app --host 0.0.0.0 --port 8000 --app-dir src'
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "$STARTUP"
                az webapp update \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --https-only true
                az webapp start \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)"

                echo "Waiting for health..."
                for i in $(seq 1 24); do
                  CODE=$(curl -sS --max-time 20 -o /tmp/health.json -w "%{http_code}" \
                    "https://$(appName).azurewebsites.net/health" || echo 000)
                  echo "attempt $i -> HTTP $CODE"
                  if [ "$CODE" = "200" ]; then
                    cat /tmp/health.json
                    echo
                    echo "Webhook URL: https://$(appName).azurewebsites.net/webhooks/whatsapp"
                    exit 0
                  fi
                  sleep 10
                done
                echo "Health check failed after deploy"
                exit 1
