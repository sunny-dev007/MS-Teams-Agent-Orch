# Kept in sync with /azure-pipelines.yml (Azure DevOps entrypoint).
# CI/CD for WhatsApp AI Agent → Azure App Service (whatsapp-ai-agent-sunny)
#
# Reliable path for App Service Python:
#   - Ship SOURCE only (no host-built .python_packages)
#   - Let Oryx build antenv ON App Service (matches App Service glibc)
#   - Do NOT stop the site; deploy async; success = /health 200
#
# Why not prebuild on ubuntu/docker slim?
#   cryptography/pydantic wheels from newer glibc fail on App Service with:
#   GLIBC_2.33 not found — breaks WhatsApp hello when graph imports Google libs.
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install .
            displayName: "Install deps for tests"

          - script: |
              set -euo pipefail
              pip install pytest pytest-asyncio httpx
              PYTHONPATH=src python -m pytest tests/ -v --tb=short
            displayName: "Run tests"
            continueOnError: true

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                --exclude='sample-apps/' \
                --exclude='.python_packages/' \
                --exclude='antenv/' \
                "$(Build.SourcesDirectory)/" "$STAGE/"
            displayName: "Stage source package (no prebuilt wheels)"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy (Oryx on App Service)"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        timeoutInMinutes: 45
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          - task: AzureCLI@2
            displayName: "Enable Oryx remote build + startup"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Keep site running — avoid long stop/start outages.
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                    ENABLE_ORYX_BUILD=true \
                    ORYX_DISABLE_OUTPUT_COPY_COMPRESSION=true \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
                    GIT_PYTHON_REFRESH=quiet
                # Remove host PYTHONPATH that pointed at incompatible .python_packages
                az webapp config appsettings delete \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --setting-names PYTHONPATH \
                  || true
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "bash infra/startup.sh"

          - task: AzureCLI@2
            displayName: "ZIP deploy (Oryx builds antenv)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ZIP="$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                test -f "$ZIP"
                echo "Deploying $ZIP"
                # Prefer async; do not block 15m on CLI "Starting the site..."
                az webapp deploy \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --src-path "$ZIP" \
                  --type zip \
                  --async true \
                  || az webapp deployment source config-zip \
                       --resource-group "$(resourceGroup)" \
                       --name "$(appName)" \
                       --src "$ZIP" \
                       --timeout 240

          - task: AzureCLI@2
            displayName: "Verify /health"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp start \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" || true

                echo "Waiting for health (Oryx may take several minutes)..."
                for i in $(seq 1 48); do
                  CODE=$(curl -sS --max-time 15 -o /tmp/health.json -w "%{http_code}" \
                    "https://$(appName).azurewebsites.net/health" || echo 000)
                  echo "attempt $i -> HTTP $CODE"
                  if [ "$CODE" = "200" ]; then
                    cat /tmp/health.json
                    echo
                    exit 0
                  fi
                  if [ "$CODE" = "403" ]; then
                    az webapp start \
                      --resource-group "$(resourceGroup)" \
                      --name "$(appName)" || true
                  fi
                  sleep 15
                done
                echo "Health check failed after deploy"
                exit 1
