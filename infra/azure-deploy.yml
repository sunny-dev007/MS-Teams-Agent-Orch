# Kept in sync with /azure-pipelines.yml (Azure DevOps entrypoint).
# CI/CD for WhatsApp AI Agent → Azure App Service (whatsapp-ai-agent-sunny)
#
# Reliable path for App Service Python:
#   - Ship SOURCE only (no host-built .python_packages)
#   - Let Oryx build antenv ON App Service (matches App Service glibc)
#   - Kudu async zipdeploy (do not block on 10m site-start watcher)
#   - Success = /health 200 after Oryx finishes
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install "pydantic-settings>=2.5"
              pip install pytest pytest-asyncio httpx
              pip install .
            displayName: "Install deps for tests"

          - script: |
              set -euo pipefail
              PYTHONPATH=src python -m pytest tests/ -v --tb=short -q
            displayName: "Run tests"

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                --exclude='sample-apps/' \
                --exclude='.python_packages/' \
                --exclude='antenv/' \
                --exclude='src/web/' \
                "$(Build.SourcesDirectory)/" "$STAGE/"
            displayName: "Stage source package (no prebuilt wheels)"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy (Oryx on App Service)"
    dependsOn: Build
    condition: and(succeeded('Build'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        timeoutInMinutes: 45
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          - task: AzureCLI@2
            displayName: "Enable Oryx remote build + startup"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                    ENABLE_ORYX_BUILD=true \
                    ORYX_DISABLE_OUTPUT_COPY_COMPRESSION=true \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
                    SCM_COMMAND_IDLE_TIMEOUT=1800 \
                    GIT_PYTHON_REFRESH=quiet
                az webapp config appsettings delete \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --setting-names PYTHONPATH \
                  || true
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "bash infra/startup.sh"

          - task: AzureCLI@2
            displayName: "ZIP deploy async (Kudu — no site-start wait)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ZIP="$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                test -f "$ZIP"
                KUDU_USER=$(az webapp deployment list-publishing-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --query publishingUserName -o tsv)
                KUDU_PASS=$(az webapp deployment list-publishing-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --query publishingPassword -o tsv)
                HTTP=$(curl -sS -w "%{http_code}" -o /tmp/kudu_deploy.json \
                  -X POST \
                  -u "${KUDU_USER}:${KUDU_PASS}" \
                  "https://$(appName).scm.azurewebsites.net/api/zipdeploy?isAsync=true" \
                  --data-binary @"$ZIP" \
                  -H "Content-Type: application/octet-stream" \
                  --max-time 600)
                case "$HTTP" in
                  200|202|204) echo "Kudu async zipdeploy accepted (HTTP $HTTP)" ;;
                  *) echo "Kudu async zipdeploy failed (HTTP $HTTP)"; exit 1 ;;
                esac

          - task: AzureCLI@2
            displayName: "Verify /health"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp start \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" || true
                for i in $(seq 1 80); do
                  CODE=$(curl -sS --max-time 15 -o /tmp/health.json -w "%{http_code}" \
                    "https://$(appName).azurewebsites.net/health" || echo 000)
                  echo "attempt $i -> HTTP $CODE"
                  if [ "$CODE" = "200" ]; then
                    cat /tmp/health.json
                    exit 0
                  fi
                  sleep 15
                done
                exit 1
