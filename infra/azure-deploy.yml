# Kept in sync with /azure-pipelines.yml (Azure DevOps entrypoint).
# CI/CD for WhatsApp AI Agent → Azure App Service (whatsapp-ai-agent-sunny)
#
# Architecture (fast path):
#   1) Build stage installs deps ONCE in the pipeline agent into .python_packages
#   2) Deploy ships a lean zip with prebuilt site-packages
#   3) App Service Oryx remote-build is OFF (this was the 10–15+ min "Starting the site..." wait)
#   4) Deploy is async; pipeline only waits on /health (not az CLI site-start polling)
#
# Target evolution (Phase 2): ACR + Linux container App Service — deploy becomes image pull (~2–4 min).
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"

stages:
  - stage: Build
    displayName: "Build & Test (prebuild deps)"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install .
            displayName: "Install deps for tests"

          - script: |
              set -euo pipefail
              pip install pytest pytest-asyncio httpx
              PYTHONPATH=src python -m pytest tests/ -v --tb=short
            displayName: "Run tests"
            continueOnError: true

          # Prebuild site-packages for App Service — eliminates Oryx pip install on the server.
          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                --exclude='sample-apps/' \
                --exclude='tests/' \
                --exclude='docs/' \
                --exclude='*.pdf' \
                --exclude='test.db*' \
                "$(Build.SourcesDirectory)/" "$STAGE/"

              python -m pip install --upgrade pip
              python -m pip install \
                --target "$STAGE/.python_packages/lib/site-packages" \
                -r "$STAGE/requirements.txt"
              python -m pip install \
                --target "$STAGE/.python_packages/lib/site-packages" \
                --no-deps \
                "$STAGE"

              echo "Package size:"
              du -sh "$STAGE" "$STAGE/.python_packages" || true
            displayName: "Stage lean app + prebuilt .python_packages"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy (no Oryx / health-gated)"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        timeoutInMinutes: 30
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          - task: AzureCLI@2
            displayName: "Disable remote Oryx build + set startup"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                # Do NOT stop the site — stop→start is a major reason for long "Starting the site..." waits.
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                    ENABLE_ORYX_BUILD=false \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=300 \
                    GIT_PYTHON_REFRESH=quiet \
                    PYTHONPATH="/home/site/wwwroot/.python_packages/lib/site-packages:/home/site/wwwroot/src"

                STARTUP='python -m uvicorn agent.main:app --host 0.0.0.0 --port 8000 --app-dir src'
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "$STARTUP"

          - task: AzureCLI@2
            displayName: "ZIP deploy async (no site-start wait)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                ZIP="$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                test -f "$ZIP"
                echo "Deploying $ZIP (async; health poll owns success)"
                # Avoid config-zip --timeout 1800 which blocks 10–15m on "Starting the site..."
                az webapp deploy \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --src-path "$ZIP" \
                  --type zip \
                  --async true \
                  || az webapp deployment source config-zip \
                       --resource-group "$(resourceGroup)" \
                       --name "$(appName)" \
                       --src "$ZIP" \
                       --timeout 180

          - task: AzureCLI@2
            displayName: "Verify /health (success gate)"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp start \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" || true

                echo "Waiting for health (max ~6 minutes)..."
                for i in $(seq 1 36); do
                  CODE=$(curl -sS --max-time 15 -o /tmp/health.json -w "%{http_code}" \
                    "https://$(appName).azurewebsites.net/health" || echo 000)
                  echo "attempt $i -> HTTP $CODE"
                  if [ "$CODE" = "200" ]; then
                    cat /tmp/health.json
                    echo
                    echo "Portal: https://$(appName).azurewebsites.net/portal"
                    echo "Webhook: https://$(appName).azurewebsites.net/webhooks/whatsapp"
                    exit 0
                  fi
                  if [ "$CODE" = "403" ]; then
                    az webapp start \
                      --resource-group "$(resourceGroup)" \
                      --name "$(appName)" || true
                  fi
                  sleep 10
                done
                echo "Health check failed after deploy"
                az webapp log deployment list \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  -o table || true
                exit 1
