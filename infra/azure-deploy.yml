# Kept in sync with /azure-pipelines.yml (Azure DevOps entrypoint).
# Prefer editing azure-pipelines.yml at repo root.
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: "AI Copilot"
  appName: "whatsapp-ai-agent-sunny"
  resourceGroup: "ai-agent-rg"
  pythonVersion: "3.12"

stages:
  - stage: Build
    displayName: "Build & Test"
    jobs:
      - job: Build
        displayName: "Build package"
        steps:
          - checkout: self
            clean: true

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              set -euo pipefail
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install .
            displayName: "Install dependencies"

          - script: |
              set -euo pipefail
              pip install pytest pytest-asyncio httpx
              PYTHONPATH=src python -m pytest tests/ -v --tb=short
            displayName: "Run tests"
            continueOnError: true

          - script: |
              set -euo pipefail
              STAGE="$(Build.ArtifactStagingDirectory)/app"
              mkdir -p "$STAGE"
              rsync -a \
                --exclude='.git/' \
                --exclude='.venv/' \
                --exclude='venv/' \
                --exclude='.env' \
                --exclude='agent.db' \
                --exclude='agent.db-*' \
                --exclude='tmp/' \
                --exclude='workspaces/' \
                --exclude='.pytest_cache/' \
                --exclude='__pycache__/' \
                --exclude='*.pyc' \
                --exclude='.DS_Store' \
                --exclude='*.egg-info/' \
                "$(Build.SourcesDirectory)/" "$STAGE/"
            displayName: "Stage deploy files"

          - task: ArchiveFiles@2
            displayName: "Create deployment zip"
            inputs:
              rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/app"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            artifact: drop
            displayName: "Publish drop artifact"

  - stage: Deploy
    displayName: "Deploy to Azure App Service"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: "Deploy whatsapp-ai-agent-sunny"
        steps:
          - download: current
            artifact: drop
            displayName: "Download drop artifact"

          - task: AzureWebApp@1
            displayName: "Deploy to Azure Web App"
            inputs:
              azureSubscription: "$(azureSubscription)"
              appType: webAppLinux
              appName: "$(appName)"
              package: "$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
              runtimeStack: "PYTHON|3.12"
              startUpCommand: "bash /home/site/wwwroot/infra/startup.sh"

          - task: AzureCLI@2
            displayName: "Enable Always On + webhook-ready settings"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --always-on true \
                  --startup-file "bash /home/site/wwwroot/infra/startup.sh"
                az webapp update \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --https-only true
                az webapp config appsettings set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)" \
                  --settings \
                    SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                    ENABLE_ORYX_BUILD=true \
                    WEBSITES_PORT=8000 \
                    WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
                    PYTHONPATH=/home/site/wwwroot/src
                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(appName)"
                echo "Webhook URL: https://$(appName).azurewebsites.net/webhooks/whatsapp"
                echo "Health URL:  https://$(appName).azurewebsites.net/health"
